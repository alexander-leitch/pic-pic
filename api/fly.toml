# fly.toml app configuration file generated for picpic-api on 2026-07-07T15:50:28+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'picpic-api'
primary_region = 'jnb'

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  CACHE_STORE = 'file'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/data/database.sqlite'
  FILESYSTEM_DISK = 'local'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'error'
  QUEUE_CONNECTION = 'sync'
  SESSION_DRIVER = 'file'

[[mounts]]
  source = 'picpic_data'
  destination = '/data'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
